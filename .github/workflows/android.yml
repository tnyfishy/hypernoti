name: Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build, unit tests, and lint
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug 2>&1 | tee gradle-ci.log
      - name: Record build diagnosis
        if: steps.build.outcome == 'failure'
        run: |
          printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
          tail -c 16000 gradle-ci.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: hypernoti-debug
          path: app/build/outputs/apk/debug/app-debug.apk
