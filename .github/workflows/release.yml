name: Publish preview APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify prepared APK checksum and signature
        run: |
          cd release-assets/v0.1.0
          sha256sum -c SHA256SUMS.txt
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose HyperNoti-preview.apk
      - name: Prepare APK and checksum
        run: |
          mkdir -p release-artifacts
          cp release-assets/v0.1.0/HyperNoti-preview.apk release-assets/v0.1.0/SHA256SUMS.txt release-assets/v0.1.0/BUILD_INFO.txt release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: hypernoti-preview
          path: release-artifacts/
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/HyperNoti-preview.apk release-artifacts/SHA256SUMS.txt release-artifacts/BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "HyperNoti $RELEASE_TAG — Preview" --notes-file RELEASE_NOTES.md
