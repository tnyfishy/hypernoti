name: Publish preview APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.2.0-preview.1
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify prepared APK checksum and signature
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[A-Za-z0-9.-]+)?$ ]]; then
            printf 'Invalid version tag\n' >&2
            exit 1
          fi
          ASSET_DIR="release-assets/${BASH_REMATCH[1]}"
          printf 'asset_dir=%s\n' "$ASSET_DIR" >> "$GITHUB_OUTPUT"
          cd "$ASSET_DIR"
          sha256sum -c SHA256SUMS.txt
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose HyperNoti-preview.apk
      - name: Prepare APK and checksum
        env:
          ASSET_DIR: ${{ steps.verify.outputs.asset_dir }}
        run: |
          mkdir -p release-artifacts
          cp "$ASSET_DIR/HyperNoti-preview.apk" "$ASSET_DIR/SHA256SUMS.txt" "$ASSET_DIR/BUILD_INFO.txt" release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: hypernoti-preview
          path: release-artifacts/
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/HyperNoti-preview.apk release-artifacts/SHA256SUMS.txt release-artifacts/BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "HyperNoti $RELEASE_TAG — Preview" --notes-file RELEASE_NOTES.md
