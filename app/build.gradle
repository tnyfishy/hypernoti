plugins { id 'com.android.application' }
android {
 namespace 'dev.hypernoti'
 compileSdk 35
 buildToolsVersion "35.0.0"
 testOptions { unitTests.includeAndroidResources = true }
 signingConfigs {
  debug { storeFile file((System.getenv('ANDROID_USER_HOME') ?: System.getProperty('user.home') + '/.android') + '/debug.keystore') }
 }
 bundle { language { enableSplit = false } }
 buildFeatures { aidl true }
 defaultConfig { applicationId 'dev.hypernoti'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly 'androidx.annotation:annotation:1.3.0'; implementation 'dev.rikka.shizuku:api:13.1.5'; implementation 'dev.rikka.shizuku:provider:13.1.5'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }

tasks.withType(Test).configureEach {
 systemProperty 'user.home', System.getenv('HYPERNOTI_TEST_HOME') ?: System.getProperty('user.home')
 systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
 ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort'].each { key ->
  if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
 }
}
